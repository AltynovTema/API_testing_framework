[pytest]
# Логирование
log_cli = true
log_cli_level = INFO
log_format = %(message)s

# Маркеры (группы тестов)
markers =
    smoke: быстрые проверочные тесты
    regression: длинные регрессионные тесты
    api: API-тесты
    slow: медленные тесты (длительность > 5 сек)
    flaky: нестабильные тесты (требуют повторного запуска)
    auth: тесты авторизации
    movies: тесты фильмов

# Где искать тесты
testpaths = tests
